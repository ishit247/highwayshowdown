<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Star Blaster</title>
<style>
  html,body{margin:0;height:100%;background:#05060f;color:#fff;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
  canvas{background:#0a0d24;border:2px solid #2a3170;border-radius:8px;max-width:100vw;max-height:100vh}
</style>
</head>
<body>
<canvas id="c" width="480" height="640"></canvas>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const W = c.width, H = c.height;
const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key === ' ') e.preventDefault(); if (state !== 'play' && (e.key === 'Enter' || e.key === ' ')) start(); });
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
// touch / mouse: drag to move, auto-fire
let pointerX = null;
c.addEventListener('pointerdown', e => { if (state !== 'play') start(); pointerX = px(e); });
c.addEventListener('pointermove', e => { if (pointerX !== null) pointerX = px(e); });
addEventListener('pointerup', () => pointerX = null);
const px = e => (e.clientX - c.getBoundingClientRect().left) * W / c.getBoundingClientRect().width;

let state = 'menu', player, bullets, enemies, particles, stars, score, best = +localStorage.getItem('sb_best') || 0, lives, t, shootCd, spawnCd, level;

stars = Array.from({length: 70}, () => ({x: Math.random()*W, y: Math.random()*H, s: Math.random()*2+.5}));

function start() {
  state = 'play'; score = 0; lives = 3; t = 0; level = 1;
  player = {x: W/2, y: H-60, w: 28, inv: 0};
  bullets = []; enemies = []; particles = []; shootCd = 0; spawnCd = 0;
}

function boom(x, y, col, n = 14) {
  for (let i = 0; i < n; i++) {
    const a = Math.random()*Math.PI*2, v = Math.random()*3+1;
    particles.push({x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, life: 30+Math.random()*20, col});
  }
}

function update() {
  for (const s of stars) { s.y += s.s * (state==='play' ? 1.2 : .4); if (s.y > H) { s.y = 0; s.x = Math.random()*W; } }
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life--; }
  particles = particles.filter(p => p.life > 0);
  if (state !== 'play') return;

  t++;
  level = 1 + Math.floor(score / 500);
  const sp = 5;
  if (keys['arrowleft'] || keys['a']) player.x -= sp;
  if (keys['arrowright'] || keys['d']) player.x += sp;
  if (pointerX !== null) player.x += Math.max(-sp*1.5, Math.min(sp*1.5, pointerX - player.x));
  player.x = Math.max(player.w/2, Math.min(W - player.w/2, player.x));
  if (player.inv > 0) player.inv--;

  shootCd--;
  if ((keys[' '] || keys['arrowup'] || keys['w'] || pointerX !== null) && shootCd <= 0) {
    bullets.push({x: player.x, y: player.y - 16});
    shootCd = 10;
  }
  bullets.forEach(b => b.y -= 9);
  bullets = bullets.filter(b => b.y > -10);

  if (--spawnCd <= 0) {
    const big = Math.random() < .2;
    enemies.push({x: 20 + Math.random()*(W-40), y: -20, r: big ? 22 : 13, hp: big ? 3 : 1,
      vy: (1 + Math.random()*1.2 + level*.25) * (big ? .7 : 1), vx: (Math.random()-.5)*1.5, big});
    spawnCd = Math.max(14, 45 - level*4);
  }
  for (const e of enemies) {
    e.x += e.vx; e.y += e.vy;
    if (e.x < e.r || e.x > W - e.r) e.vx *= -1;
  }

  for (const e of enemies) for (const b of bullets) {
    if (!b.dead && Math.hypot(e.x-b.x, e.y-b.y) < e.r + 3) {
      b.dead = true; e.hp--;
      boom(b.x, b.y, '#ffd166', 4);
      if (e.hp <= 0) { e.dead = true; score += e.big ? 50 : 10; boom(e.x, e.y, e.big ? '#ff7b54' : '#ef476f', e.big ? 30 : 14); }
    }
  }
  for (const e of enemies) {
    if (!e.dead && player.inv <= 0 && Math.hypot(e.x-player.x, e.y-player.y) < e.r + 12) {
      e.dead = true; lives--; player.inv = 90; boom(player.x, player.y, '#06d6a0', 30);
      if (lives <= 0) { state = 'over'; if (score > best) { best = score; try { localStorage.setItem('sb_best', best); } catch(e){} } }
    }
    if (!e.dead && e.y > H + 30) { e.dead = true; score = Math.max(0, score - 5); }
  }
  bullets = bullets.filter(b => !b.dead);
  enemies = enemies.filter(e => !e.dead);
}

function text(s, x, y, size, col = '#fff', align = 'center') {
  ctx.fillStyle = col; ctx.font = `bold ${size}px system-ui`; ctx.textAlign = align; ctx.fillText(s, x, y);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#9fb0ff';
  for (const s of stars) ctx.fillRect(s.x, s.y, s.s, s.s);

  for (const p of particles) { ctx.globalAlpha = p.life/50; ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, 3, 3); }
  ctx.globalAlpha = 1;

  if (state !== 'menu') {
    ctx.fillStyle = '#ffd166';
    bullets.forEach(b => ctx.fillRect(b.x-2, b.y-8, 4, 12));
    for (const e of enemies) {
      ctx.fillStyle = e.big ? '#ff7b54' : '#ef476f';
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 7); ctx.fill();
      ctx.fillStyle = '#0a0d24';
      ctx.beginPath(); ctx.arc(e.x - e.r*.3, e.y - e.r*.2, e.r*.18, 0, 7); ctx.arc(e.x + e.r*.3, e.y - e.r*.2, e.r*.18, 0, 7); ctx.fill();
    }
    if (state === 'play' && !(player.inv > 0 && Math.floor(player.inv/5) % 2)) {
      const {x, y} = player;
      ctx.fillStyle = '#06d6a0';
      ctx.beginPath(); ctx.moveTo(x, y-18); ctx.lineTo(x+16, y+14); ctx.lineTo(x, y+7); ctx.lineTo(x-16, y+14); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffd166';
      ctx.fillRect(x-3, y+9, 6, 4 + (t%6));
    }
    text('Score ' + score, 12, 26, 18, '#fff', 'left');
    text('Level ' + level, W/2, 26, 18);
    text('♥'.repeat(Math.max(0, lives)), W-12, 26, 18, '#ef476f', 'right');
  }

  if (state === 'menu') {
    text('STAR BLASTER', W/2, 220, 44, '#06d6a0');
    text('← → / A D to move · Space to shoot', W/2, 290, 16, '#c9d1ff');
    text('Touch: drag to move & auto-fire', W/2, 316, 16, '#c9d1ff');
    text('Press Enter / Space / Click to start', W/2, 380, 20, '#ffd166');
    if (best) text('Best: ' + best, W/2, 420, 16, '#c9d1ff');
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(5,6,15,.7)'; ctx.fillRect(0, 0, W, H);
    text('GAME OVER', W/2, 250, 44, '#ef476f');
    text('Score: ' + score, W/2, 300, 24);
    text('Best: ' + best, W/2, 332, 18, '#c9d1ff');
    text('Press Enter / Space / Click to retry', W/2, 390, 20, '#ffd166');
  }
}

(function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
