<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dead Zone</title>
<style>
  html,body{margin:0;height:100%;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{background:#1b1f1a;cursor:crosshair;max-width:100vw;max-height:100vh}
</style>
</head>
<body>
<canvas id="c" width="960" height="640"></canvas>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const W = c.width, H = c.height;
const keys = {}, mouse = {x: W/2, y: H/2, down: false};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); keys[k] = true;
  if (k === ' ') e.preventDefault();
  if (state !== 'play' && (k === 'enter' || k === ' ')) start();
  if (state === 'play') { if (k === 'r') reload(); if (k >= '1' && k <= '3') p.gun = +k - 1 }
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
c.addEventListener('mousemove', e => { const r = c.getBoundingClientRect(); mouse.x = (e.clientX-r.left)*W/r.width; mouse.y = (e.clientY-r.top)*H/r.height; });
c.addEventListener('mousedown', () => { mouse.down = true; if (state !== 'play') start(); });
addEventListener('mouseup', () => mouse.down = false);
c.addEventListener('contextmenu', e => e.preventDefault());

const GUNS = [
  {name: 'Pistol',  dmg: 1, rate: 14, mag: 12, reload: 60, spread: .03, pellets: 1, spd: 13, auto: false},
  {name: 'SMG',     dmg: 1, rate: 5,  mag: 30, reload: 80, spread: .10, pellets: 1, spd: 14, auto: true},
  {name: 'Shotgun', dmg: 1, rate: 40, mag: 6,  reload: 100, spread: .30, pellets: 7, spd: 11, auto: false},
];

let state = 'menu', p, bullets, zombies, parts, drops, wave, score, best = +localStorage.getItem('dz_best') || 0, spawnLeft, spawnCd, waveBreak, shake = 0, wasDown = false;

function start() {
  state = 'play'; score = 0; wave = 0;
  p = {x: W/2, y: H/2, hp: 100, gun: 0, ammo: GUNS.map(g => g.mag), cd: 0, rel: 0, hurt: 0, unlocked: [true, false, false]};
  bullets = []; zombies = []; parts = []; drops = []; waveBreak = 90; spawnLeft = 0;
}

function reload() {
  const g = GUNS[p.gun];
  if (p.rel <= 0 && p.ammo[p.gun] < g.mag) p.rel = g.reload;
}

function blood(x, y, n, col = '#9b1c1c') {
  for (let i = 0; i < n; i++) { const a = Math.random()*6.28, v = Math.random()*3+.5; parts.push({x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, life: 20+Math.random()*25, col}); }
}

function spawnZombie() {
  const side = Math.floor(Math.random()*4);
  let x, y;
  if (side === 0) { x = Math.random()*W; y = -20; } else if (side === 1) { x = W+20; y = Math.random()*H; }
  else if (side === 2) { x = Math.random()*W; y = H+20; } else { x = -20; y = Math.random()*H; }
  const r = Math.random();
  let type = {r: 13, hp: 2, spd: 1.1 + wave*.04, col: '#5a8f4a', pts: 10};
  if (wave >= 2 && r < .25) type = {r: 10, hp: 1, spd: 2.2 + wave*.05, col: '#c9b037', pts: 15};
  if (wave >= 3 && r > .88) type = {r: 22, hp: 8 + wave, spd: .7, col: '#7a3b8f', pts: 50};
  zombies.push({x, y, ...type, maxHp: type.hp, hit: 0});
}

function update() {
  for (const q of parts) { q.x += q.vx; q.y += q.vy; q.vx *= .94; q.vy *= .94; q.life--; }
  parts = parts.filter(q => q.life > 0);
  if (shake > 0) shake *= .85;
  if (state !== 'play') return;

  // movement
  let dx = (keys['d']||keys['arrowright']?1:0) - (keys['a']||keys['arrowleft']?1:0);
  let dy = (keys['s']||keys['arrowdown']?1:0) - (keys['w']||keys['arrowup']?1:0);
  const m = Math.hypot(dx, dy) || 1;
  const speed = keys['shift'] ? 4.2 : 3;
  p.x = Math.max(14, Math.min(W-14, p.x + dx/m*speed));
  p.y = Math.max(14, Math.min(H-14, p.y + dy/m*speed));
  p.ang = Math.atan2(mouse.y - p.y, mouse.x - p.x);
  if (p.hurt > 0) p.hurt--;

  // shooting
  const g = GUNS[p.gun];
  p.cd--;
  if (p.rel > 0) { if (--p.rel === 0) p.ammo[p.gun] = g.mag; }
  const trigger = g.auto ? mouse.down : (mouse.down && !wasDown);
  wasDown = mouse.down;
  if (trigger && p.cd <= 0 && p.rel <= 0) {
    if (p.ammo[p.gun] > 0) {
      p.ammo[p.gun]--; p.cd = g.rate; shake = Math.max(shake, g.pellets > 1 ? 6 : 2);
      for (let i = 0; i < g.pellets; i++) {
        const a = p.ang + (Math.random()-.5)*g.spread*2;
        bullets.push({x: p.x + Math.cos(p.ang)*22, y: p.y + Math.sin(p.ang)*22, vx: Math.cos(a)*g.spd, vy: Math.sin(a)*g.spd, life: 60, dmg: g.dmg});
      }
    } else reload();
  }
  for (const b of bullets) { b.x += b.vx; b.y += b.vy; b.life--; }

  // waves
  if (spawnLeft <= 0 && zombies.length === 0) {
    if (--waveBreak <= 0) {
      wave++; spawnLeft = 6 + wave*4; spawnCd = 0; waveBreak = 150;
      if (wave === 3) p.unlocked[1] = true;
      if (wave === 5) p.unlocked[2] = true;
      if (wave % 3 === 0) drops.push({x: 80 + Math.random()*(W-160), y: 80 + Math.random()*(H-160), type: 'hp'});
      drops.push({x: 80 + Math.random()*(W-160), y: 80 + Math.random()*(H-160), type: 'ammo'});
    }
  } else if (spawnLeft > 0 && --spawnCd <= 0) { spawnZombie(); spawnLeft--; spawnCd = Math.max(12, 50 - wave*3); }

  // zombies
  for (const z of zombies) {
    const a = Math.atan2(p.y - z.y, p.x - z.x);
    z.x += Math.cos(a)*z.spd; z.y += Math.sin(a)*z.spd; z.ang = a; if (z.hit > 0) z.hit--;
    for (const o of zombies) if (o !== z) { // separation
      const d = Math.hypot(z.x-o.x, z.y-o.y), min = z.r + o.r - 4;
      if (d < min && d > 0) { z.x += (z.x-o.x)/d*.6; z.y += (z.y-o.y)/d*.6; }
    }
    if (Math.hypot(z.x-p.x, z.y-p.y) < z.r + 12 && p.hurt <= 0) {
      p.hp -= z.r > 20 ? 25 : 10; p.hurt = 40; shake = 10; blood(p.x, p.y, 10, '#c22');
      if (p.hp <= 0) { state = 'over'; if (score > best) { best = score; try { localStorage.setItem('dz_best', best) } catch(e){} } }
    }
  }
  for (const b of bullets) for (const z of zombies) {
    if (!b.dead && z.hp > 0 && Math.hypot(b.x-z.x, b.y-z.y) < z.r + 3) {
      b.dead = true; z.hp -= b.dmg; z.hit = 4; blood(b.x, b.y, 4);
      if (z.hp <= 0) { score += z.pts; blood(z.x, z.y, 16); }
    }
  }
  bullets = bullets.filter(b => !b.dead && b.life > 0);
  zombies = zombies.filter(z => z.hp > 0);

  // pickups
  for (const d of drops) if (Math.hypot(d.x-p.x, d.y-p.y) < 24) {
    d.got = true;
    if (d.type === 'hp') p.hp = Math.min(100, p.hp + 40);
    else p.ammo = GUNS.map(g => g.mag);
  }
  drops = drops.filter(d => !d.got);
}

function text(s, x, y, size, col = '#fff', align = 'center') { ctx.fillStyle = col; ctx.font = `bold ${size}px system-ui`; ctx.textAlign = align; ctx.fillText(s, x, y); }

function draw() {
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  if (shake > .5) ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);
  // floor grid
  ctx.strokeStyle = '#232a21'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 48) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 48) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  for (const q of parts) { ctx.globalAlpha = Math.min(1, q.life/25); ctx.fillStyle = q.col; ctx.fillRect(q.x, q.y, 3, 3); }
  ctx.globalAlpha = 1;

  if (state !== 'menu') {
    for (const d of drops) {
      ctx.fillStyle = d.type === 'hp' ? '#e63946' : '#ffd166';
      ctx.fillRect(d.x-10, d.y-10, 20, 20);
      text(d.type === 'hp' ? '+' : 'A', d.x, d.y+6, 16, '#111');
    }
    for (const z of zombies) {
      ctx.fillStyle = z.hit ? '#fff' : z.col;
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, 7); ctx.fill();
      ctx.fillStyle = '#300';
      ctx.beginPath(); ctx.arc(z.x + Math.cos(z.ang)*z.r*.5, z.y + Math.sin(z.ang)*z.r*.5, z.r*.25, 0, 7); ctx.fill();
      if (z.maxHp > 3) { ctx.fillStyle = '#400'; ctx.fillRect(z.x-z.r, z.y-z.r-8, z.r*2, 4); ctx.fillStyle = '#e63946'; ctx.fillRect(z.x-z.r, z.y-z.r-8, z.r*2*z.hp/z.maxHp, 4); }
    }
    ctx.fillStyle = '#ffe28a';
    for (const b of bullets) ctx.fillRect(b.x-2, b.y-2, 4, 4);

    if (state === 'play') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.ang);
      ctx.fillStyle = p.hurt % 8 > 4 ? '#fff' : '#4aa3df';
      ctx.beginPath(); ctx.arc(0, 0, 13, 0, 7); ctx.fill();
      ctx.fillStyle = '#333'; ctx.fillRect(6, -3, 20, 6);
      ctx.restore();
      // crosshair
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 8, 0, 7); ctx.moveTo(mouse.x-13, mouse.y); ctx.lineTo(mouse.x-4, mouse.y); ctx.moveTo(mouse.x+4, mouse.y); ctx.lineTo(mouse.x+13, mouse.y); ctx.stroke();
    }
  }
  ctx.restore();

  if (state !== 'menu') {
    text('Score ' + score, 16, 28, 20, '#fff', 'left');
    text('Wave ' + wave, W/2, 28, 20);
    ctx.fillStyle = '#400'; ctx.fillRect(16, H-30, 200, 14);
    ctx.fillStyle = '#e63946'; ctx.fillRect(16, H-30, 2*Math.max(0, p.hp), 14);
    if (p) {
      const g = GUNS[p.gun];
      text(p.rel > 0 ? `${g.name} — reloading…` : `${g.name}  ${p.ammo[p.gun]}/${g.mag}`, W-16, H-16, 20, p.ammo[p.gun] ? '#fff' : '#e63946', 'right');
      let s = ''; GUNS.forEach((g, i) => { if (p.unlocked[i]) s += `[${i+1}] ${g.name}  `; });
      text(s, W-16, H-44, 14, '#9ab', 'right');
    }
    if (state === 'play' && spawnLeft <= 0 && zombies.length === 0 && waveBreak > 0) text(`Wave ${wave+1} incoming…`, W/2, 100, 28, '#ffd166');
  }

  if (state === 'menu') {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
    text('DEAD ZONE', W/2, 220, 64, '#e63946');
    text('WASD move · Shift sprint · Mouse aim & shoot', W/2, 290, 20, '#cde');
    text('R reload · 1/2/3 switch weapon (unlocked by wave)', W/2, 322, 20, '#cde');
    text('Press Enter or click to start', W/2, 400, 26, '#ffd166');
    if (best) text('Best: ' + best, W/2, 440, 18, '#9ab');
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(30,0,0,.7)'; ctx.fillRect(0, 0, W, H);
    text('YOU DIED', W/2, 250, 64, '#e63946');
    text(`Score ${score}  ·  Wave ${wave}  ·  Best ${best}`, W/2, 305, 22);
    text('Press Enter or click to retry', W/2, 370, 24, '#ffd166');
  }
}

(function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
