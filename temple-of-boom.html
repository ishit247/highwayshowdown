<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temple of Boom</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{image-rendering:pixelated;max-width:100vw;max-height:100vh;background:#8b6a30}
</style>
</head>
<body>
<canvas id="c" width="900" height="570"></canvas>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const W = c.width, H = c.height;
const FONT = '"Press Start 2P", "Courier New", monospace';
ctx.imageSmoothingEnabled = false;

// ---------- persistent save ----------
const save = (() => {
  let d = {coins: 0, owned: [0], chosen: 0, temples: 1};
  try { Object.assign(d, JSON.parse(localStorage.getItem('tob_save') || '{}')); } catch (e) {}
  return { d, write() { try { localStorage.setItem('tob_save', JSON.stringify(d)); } catch (e) {} } };
})();

const CHARS = [
  {name: 'Beat Bot',   weapon: 'Pistol',       extra: '',          cost: 0,   skin: '#3ba4e0', hat: 'band', hatC: '#d6334c', body: '#d6334c'},
  {name: 'Cactus Kid', weapon: 'Machine Gun',  extra: '',          cost: 100, skin: '#2fb59a', hat: 'cowboy', hatC: '#a8803a', body: '#6b4a2a'},
  {name: 'Tamago',     weapon: 'Shotgun',      extra: 'Health+1',  cost: 250, skin: '#e0483a', hat: 'cap', hatC: '#e8892b', body: '#b9a6d6'},
];

// ---------- background ----------
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
function makeBrick(g, base, mortar, light, w, h) {
  g.fillStyle = mortar; g.fillRect(0, 0, w, h);
  const bh = 24, bw = 56;
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let r = 0; r * bh < h; r++) {
    const off = (r % 2) * bw / 2 - bw / 2;
    for (let x = off; x < w; x += bw) {
      g.fillStyle = rnd() < .5 ? base : light;
      g.fillRect(x + 2, r * bh + 2, bw - 4, bh - 4);
      g.fillStyle = 'rgba(0,0,0,.08)'; g.fillRect(x + 2, r * bh + bh - 6, bw - 4, 4);
    }
  }
}
(function () {
  const g = bg.getContext('2d');
  makeBrick(g, '#8c6a30', '#6e5124', '#94722f', W, H);
  // simple carved glyphs
  g.strokeStyle = 'rgba(60,40,15,.35)'; g.lineWidth = 3;
  for (let i = 0; i < 14; i++) { const x = (i * 197) % W, y = (i * 113) % H; g.strokeRect(x, y, 14, 14); g.strokeRect(x + 4, y + 4, 6, 6); }
})();

// ---------- UI helpers ----------
let hits = [], mouse = {x: -1, y: -1};
let temple = 1, scene = 'mode', sel = 0, mode = 'single', gtype = 'campaign', cur = 0, flash = 0;

function txt(s, x, y, size, col, align = 'center', shadow) {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (shadow) { ctx.fillStyle = shadow; ctx.fillText(s, x + Math.max(2, size / 12), y + Math.max(2, size / 12)); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function hit(x, y, w, h, fn, idx) { hits.push({x, y, w, h, fn, idx}); }
function over(x, y, w, h) { return mouse.x >= x && mouse.x <= x + w && mouse.y >= y && mouse.y <= y + h; }

function title(y) {
  txt('TEMPLE', W / 2, y, 64, '#d9cfcf', 'center', '#8c7f93');
  txt('OF BOOM!', W / 2, y + 74, 64, '#d9cfcf', 'center', '#8c7f93');
}
function bracket(x, y, col) {
  ctx.strokeStyle = col; ctx.lineWidth = 3;
  ctx.strokeRect(x - 10, y - 10, 20, 20); ctx.strokeRect(x - 4, y - 4, 8, 8);
}
function padlock(x, y, col) {
  ctx.fillStyle = col; ctx.fillRect(x - 16, y - 8, 32, 24);
  ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(x, y - 8, 9, Math.PI, 0); ctx.stroke();
  ctx.fillStyle = '#8b6a30'; ctx.fillRect(x - 3, y + 1, 6, 8);
}
// menu list item, e.g. {label, color, onSel}
function menuList(items, y0, gap) {
  items.forEach((it, i) => {
    const y = y0 + i * gap, active = sel === i;
    const col = active ? it.color : '#d9cfcf';
    ctx.font = `26px ${FONT}`;
    const w = ctx.measureText(it.label).width;
    txt(it.label, W / 2, y, 26, col, 'center', 'rgba(60,40,20,.55)');
    if (it.locked) { padlock(W / 2 - w / 2 - 28, y, col); padlock(W / 2 + w / 2 + 28, y, col); }
    else { bracket(W / 2 - w / 2 - 28, y, col); bracket(W / 2 + w / 2 + 28, y, col); }
    if (it.isNew) {
      const bx = 112, by = y - 24 + Math.sin(performance.now() / 150) * 3;
      ctx.fillStyle = '#ffcc1a'; ctx.strokeStyle = '#2a1a00'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(bx, by + 12); ctx.lineTo(bx + 40, by - 18 + 12); ctx.lineTo(bx + 40, by - 4 + 12);
      ctx.lineTo(bx + 125, by - 4 + 12); ctx.lineTo(bx + 125, by + 36); ctx.lineTo(bx + 40, by + 36); ctx.lineTo(bx + 40, by + 54); ctx.closePath();
      ctx.fill(); ctx.stroke();
      txt('NEW!', bx + 82, by + 16, 20, '#e01a1a', 'center', '#fff');
    }
    hit(W / 2 - 220, y - 22, 440, 44, () => { sel = i; it.go(); }, i);
  });
}
function button(label, x, y, w, h, fn, opts = {}) {
  const hov = over(x, y, w, h);
  ctx.fillStyle = '#8b7d7d'; ctx.fillRect(x, y + 6, w, h);
  ctx.fillStyle = opts.disabled ? '#a89c92' : opts.bg ? (hov ? opts.bgH : opts.bg) : hov || opts.focus ? '#efe6e6' : '#d6cccc'; ctx.fillRect(x, y, w, h);
  txt(label, x + w / 2, y + h / 2 + 2, opts.size || 28, opts.col || '#5a3d1d');
  if (!opts.disabled) hit(x, y, w, h, fn);
}
function speaker() {
  ctx.fillStyle = '#d6cccc'; ctx.fillRect(824, 12, 66, 66);
  ctx.fillStyle = '#4a3a2a'; ctx.fillRect(836, 36, 12, 18); ctx.beginPath(); ctx.moveTo(848, 36); ctx.lineTo(864, 24); ctx.lineTo(864, 66); ctx.lineTo(848, 54); ctx.fill();
  txt('x', 876, 46, 18, '#4a3a2a');
}
function frame(noSpeaker) { // stone doorway behind the menu
  ctx.drawImage(bg, 0, 0);
  ctx.fillStyle = '#7a5d2b'; ctx.fillRect(105, 45, 690, H);
  ctx.fillStyle = '#9c7b3a'; ctx.fillRect(150, 90, 600, H);
  ctx.fillStyle = '#8b6a30'; ctx.fillRect(105, 45, 690, 48);
  ctx.fillStyle = '#7a5d2b'; ctx.fillRect(150, 90, 8, H); ctx.fillRect(742, 90, 8, H);
  if (!noSpeaker) { speaker(); hit(824, 12, 66, 66, () => {}); }
}

// ---------- characters ----------
// step: undefined = standing; 0/1 = walking (one leg bent, then the other)
function drawChar(ch, cx, cy, s = 6, facing = 1, bob = 0, step) {
  const R = (x, y, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(cx + (facing > 0 ? x : -x - w) * s, cy + (y + bob) * s, w * s, h * s); };
  // legs
  const lc = ch.leg || '#222';
  if (step === undefined) { R(-5, 8, 4, 6, lc); R(1, 8, 4, 6, lc); }
  else { R(-5, 8, 4, step ? 6 : 3, lc); R(1, 8, 4, step ? 3 : 6, lc); }
  // body
  R(-6, 1, 12, 8, ch.body);
  // head
  R(-6, -9, 12, 10, ch.skin);
  // eye / visor
  R(1, -6, 4, 3, '#fff'); R(3, -5, 2, 2, '#111');
  // hat
  if (ch.hat === 'band') { R(-7, -10, 14, 4, ch.hatC); R(-7, -6, 3, 8, ch.hatC); }
  if (ch.hat === 'cowboy') { R(-10, -11, 20, 3, ch.hatC); R(-6, -15, 12, 5, ch.hatC); R(-6, -8, 12, 2, '#222'); }
  if (ch.hat === 'cap') { R(-7, -12, 14, 5, ch.hatC); R(2, -8, 9, 2, ch.hatC); R(-7, -6, 3, 9, '#222'); }
  if (ch.hat === 'helmet') { R(-7, -11, 14, 6, ch.hatC); R(-7, -6, 14, 1, '#222'); }
  // gun
  if (ch.weapon === 'Launcher') { R(2, 1, 11, 5, '#6b4a2a'); R(2, 1, 11, 1, '#8a6a3a'); R(12, 0, 3, 7, '#333'); R(3, 5, 4, 4, '#333'); return; }
  const gl = ch.weapon === 'Pistol' ? 7 : ch.weapon === 'Shotgun' || ch.weapon === 'Rifle' ? 17 : ch.weapon === 'Crossbow' ? 11 : 14;
  R(2, 2, gl, 3, '#222'); R(2, 4, 4, 4, '#444'); R(2, 2, gl, 1, '#666');
}

// ---------- scenes ----------
const scenes = {
  mode() {
    frame(); title(130);
    menuList([
      {label: 'SINGLE PLAYER', color: '#fff', go: () => { mode = 'single'; scene = 'menu'; sel = 0; }},
      {label: 'TWO PLAYERS', color: '#7d7de8', go: () => { mode = 'two'; scene = 'menu'; sel = 0; }},
    ], 348, 58);
  },
  menu() {
    frame(); title(130);
    const go = t => () => { gtype = t; scene = 'controls'; sel = 0; };
    menuList([
      {label: 'CAMPAIGN', color: '#fff', go: go('campaign')},
      {label: 'ENDLESS', color: '#3b8df0', go: go('endless')},
      {label: 'TEMPLE RUSH', color: '#fff', isNew: true, go: go('rush')},
    ], 348, 58);
  },
  controls() {
    ctx.drawImage(bg, 0, 0);
    txt('CONTROLS', W / 2, 22, 28, '#ece3e3', 'center', '#5a3d1d');
    const rows = [['↑', 'JUMP / DOUBLE JUMP', 80], ['←→', 'MOVE', 175], ['↓', 'PICK UP WEAPON', 268], ['Z', 'SHOOT', 360], ['X', 'SWITCH WEAPON', 452]];
    rows.forEach(([k, label, y]) => {
      const arrows = k.length === 2;
      const key = (kx, ch) => {
        ctx.fillStyle = '#9c8a8a'; ctx.fillRect(kx, y + 5, 66, 62); ctx.fillStyle = '#d9cfcf'; ctx.fillRect(kx, y, 66, 62);
        txt(ch, kx + 33, y + 33, 34, '#5a3d1d');
      };
      if (arrows) { key(105, '←'); key(196, '→'); } else key(150, k);
      txt(label, 450 + (arrows ? 40 : 0), y + 32, 22, '#ece3e3', 'center', '#5a3d1d');
    });
    button('SKIP', 348, 505, 206, 56, () => { scene = 'chars'; cur = save.d.chosen; }, {size: 30});
  },
  chars() {
    ctx.fillStyle = '#383838'; ctx.fillRect(0, 0, W, H);
    // coins
    ctx.fillStyle = '#f0a030'; ctx.beginPath(); ctx.arc(442, 38, 17, 0, 7); ctx.fill(); ctx.strokeStyle = '#a85d10'; ctx.lineWidth = 3; ctx.stroke();
    txt(String(save.d.coins), 472, 40, 22, '#fff', 'left');

    CHARS.forEach((ch, i) => {
      const x = 10 + i * 295, y = 110, w = 288, h = 288;
      ctx.fillStyle = '#6e5442'; ctx.fillRect(x, y, w, h);
      if (cur === i) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.strokeRect(x, y, w, h); }
      hit(x, y, w, 210, () => { cur = i; });
      txt(ch.name.toUpperCase(), x + w / 2, y + 28, ch.name.length > 8 ? 20 : 22, '#fff');
      drawChar(ch, x + w / 2 - 20, y + 118, 6, 1, 0);
      txt('WEAPON- ' + ch.weapon.toUpperCase(), x + w / 2, y + 190, 11, '#fff');
      if (ch.extra) txt(ch.extra.toUpperCase().replace('+', '+'), x + w / 2, y + 214, 11, '#fff');
      const owned = save.d.owned.includes(i), prevOwned = i === 0 || save.d.owned.includes(i - 1);
      const bx = x + 18, by = y + 228, bw = w - 36, bh = 50;
      if (owned) {
        const chosen = save.d.chosen === i;
        button(chosen ? 'SELECTED' : 'SELECT', bx, by, bw, bh, () => selectChar(i), {size: 34 - (chosen ? 8 : 0)});
      } else if (prevOwned) {
        button('BUY  ' + ch.cost, bx, by, bw, bh, () => buyChar(i), {size: 28, disabled: false});
      } else {
        button('BUY PREVIOUS CHARACTERS TO UNLOCK', bx, by, bw, bh, () => {}, {size: 9, disabled: true});
      }
    });
    // arrows + menu
    const arrow = (x, dir) => {
      const hov = over(x, 470, 56, 90);
      ctx.fillStyle = '#1a1a3a'; ctx.beginPath(); ctx.moveTo(x + 50 * dir + (dir < 0 ? 5 : 0), 515);
      ctx.fillStyle = hov ? '#fff' : '#f2ebe5';
      ctx.beginPath(); ctx.moveTo(dir < 0 ? x + 2 : x + 54, 515); ctx.lineTo(dir < 0 ? x + 54 : x + 2, 470); ctx.lineTo(dir < 0 ? x + 54 : x + 2, 560); ctx.closePath(); ctx.fill();
      hit(x, 470, 56, 90, () => { cur = (cur + dir + CHARS.length) % CHARS.length; });
    };
    arrow(44, -1); arrow(800, 1);
    button('MENU', 232, 490, 436, 64, () => { scene = 'mode'; sel = 0; }, {size: 40});
    if (flash > 0) { txt('NOT ENOUGH COINS — kill enemies to earn more', W / 2, 440, 16, '#ffd166'); flash--; }
  },
  temples() {
    frame(true);
    menuList([1, 2, 3].map((n, i) => ({
      label: 'TEMPLE ' + n, color: '#4a90d9', locked: n > save.d.temples,
      go: () => { if (n <= save.d.temples) { temple = n; startGame(); } },
    })), 192, 110);
    button('MENU', 232, 492, 434, 56, () => { scene = 'mode'; sel = 0; }, {size: 36});
  },
  game() { gameUpdate(); gameDraw(); },
  oldgame() {
    ctx.fillStyle = '#20180e'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#7a5d2b'; ctx.fillRect(0, 470, W, 100);
    const ch = CHARS[save.d.chosen];
    drawChar(ch, W / 2, 400, 6, 1, Math.round(Math.sin(performance.now() / 250)));
    txt(`${mode === 'two' ? 'TWO PLAYERS' : 'SINGLE PLAYER'} · ${gtype.toUpperCase()}${gtype === 'campaign' ? ' · TEMPLE ' + temple : ''}`, W / 2, 90, 18, '#ece3e3');
    txt('GAMEPLAY COMING NEXT', W / 2, 150, 28, '#ffd166');
    txt('ESC = back to menu', W / 2, 520, 14, '#aaa');
  },
};

function selectChar(i) {
  save.d.chosen = i; save.write();
  if (gtype === 'campaign') { scene = 'temples'; sel = 0; } else startGame();
}
function buyChar(i) {
  if (save.d.coins >= CHARS[i].cost) { save.d.coins -= CHARS[i].cost; save.d.owned.push(i); save.d.chosen = i; save.write(); }
  else flash = 90;
}

// ---------- gameplay ----------
const TOTAL_CAMPAIGN_WAVES = 8;           // "Wave 1 of 8" in the reference screenshot
const SOLID = [{x: 0, y: 553, w: 900, h: 30}, {x: 325, y: 462, w: 255, h: 110}];
const ONEWAY = [
  {x: 115, y: 485, w: 117}, {x: 672, y: 485, w: 115},
  {x: 0, y: 368, w: 300}, {x: 600, y: 368, w: 300},
  {x: 92, y: 275, w: 256}, {x: 557, y: 275, w: 253},
  {x: 370, y: 182, w: 162}, {x: 0, y: 182, w: 115}, {x: 788, y: 182, w: 112},
  {x: 115, y: 90, w: 278}, {x: 510, y: 90, w: 278},
];
// platforms are solid: you can't jump up through them, you go around through the gaps
SOLID.push(...ONEWAY.map(s => ({...s, h: 22}))); ONEWAY.length = 0;
const SPOTS = [[167, 485], [735, 485], [450, 462]];   // chests sit low, on the lower platforms
const GUN = {
  'Pistol':      {rate: 14, spd: 11, n: 1, spread: .02, life: 60, auto: false, add: 20},
  'Machine Gun': {rate: 5,  spd: 12, n: 1, spread: .07, life: 60, auto: true,  add: 40},
  'Crossbow':    {rate: 30, spd: 14, n: 1, spread: .01, life: 70, auto: false, add: 20, dmg: 2},
  'Shotgun':     {rate: 36, spd: 10, n: 5, spread: .22, life: 22, auto: false, add: 10},
};
const COIN_VALUE = {gunner: 1, spider: 1, gunner2: 2, grenadier: 3, bigspider: 10};
const held = {};
addEventListener('keyup', e => { held[e.key.toLowerCase()] = false; });
let G = null;
const ov = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

const gbg = document.createElement('canvas'); gbg.width = W; gbg.height = H;
(function () {
  const g = gbg.getContext('2d');
  makeBrick(g, '#74554a', '#5f443b', '#7a5b4e', W, H);
})();

function startGame() {
  scene = 'game';
  const ch = CHARS[save.d.chosen], maxHp = 10 + (ch.extra ? 1 : 0);
  G = {paused: false, wave: 1, total: gtype === 'campaign' ? TOTAL_CAMPAIGN_WAVES : Infinity,
    phase: 'intro', timer: 180, toSpawn: 4 + 2, spawnCd: 0, enemies: [], bullets: [], ebullets: [], drops: [], items: [], parts: [], boxes: [], prevZ: false, kills: 0, earned: 0, pops: [],
    p: {x: 441, y: 400, w: 18, h: 34, vx: 0, vy: 0, face: 1, hp: maxHp, maxHp, jumps: 0, ground: false, inv: 0, kb: 0, cd: 0,
        guns: [{type: ch.weapon, ammo: ch.weapon === 'Pistol' ? 40 : ch.weapon === 'Machine Gun' ? 80 : 20}], gi: 0}};
  spawnBox(); spawnBox();
}
function spawnBox() {
  const free = SPOTS.filter(s => !G.boxes.some(b => b.x === s[0] && b.y === s[1]));
  const s = free[Math.floor(Math.random() * free.length)];
  G.boxes.push({x: s[0], y: s[1]});
}
function physics(b) {
  b.vy = Math.min(12, b.vy + .5);
  b.x += b.vx;
  for (const s of SOLID) if (ov(b, s)) b.x = b.vx > 0 ? s.x - b.w : s.x + s.w;
  b.x = Math.max(0, Math.min(W - b.w, b.x));
  const prevBottom = b.y + b.h; b.y += b.vy; b.ground = false;
  for (const s of SOLID) if (ov(b, s)) {
    if (b.vy > 0) { b.y = s.y - b.h; b.ground = true; } else b.y = s.y + s.h;
    b.vy = 0;
  }
  if (b.vy >= 0) for (const s of ONEWAY)
    if (b.x + b.w > s.x && b.x < s.x + s.w && prevBottom <= s.y + 1 && b.y + b.h >= s.y) { b.y = s.y - b.h; b.vy = 0; b.ground = true; }
}
function puff(x, y, n, col) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = Math.random() * 3 + .5; G.parts.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 15 + Math.random() * 15, col}); }
}
function gameKey(e) {
  const g = G, k = e.key.toLowerCase();
  if (k === 'escape') { if (g.phase === 'intro' || g.phase === 'play') g.paused = !g.paused; return; }
  if (g.paused || e.repeat || g.phase === 'win' || g.phase === 'lose') return;
  const p = g.p;
  if (k === 'arrowup' && p.jumps < 2) { p.vy = -9.5; p.jumps++; }
  if (k === 'x') p.gi = (p.gi + 1) % p.guns.length;
  if (k === 'arrowdown') {
    const i = g.items.findIndex(it => ov(p, {x: it.x - 18, y: it.y - 30, w: 36, h: 32}));
    if (i >= 0) {
      const type = g.items[i].type;
      g.items.splice(i, 1);
      // weapon comes with 20 bullets (+20 if you already own it)
      if (!p.guns.find(x => x.type === type)) { p.guns.push({type, ammo: 20}); p.gi = p.guns.length - 1; }
      else { p.gi = p.guns.findIndex(x => x.type === type); p.guns[p.gi].ammo += 20; }
      puff(p.x + 9, p.y + 10, 10, '#ffd166');
    }
  }
}
function hurtPlayer(dir, kb) {
  const p = G.p;
  if (p.inv > 0 || G.phase === 'lose') return;
  p.hp--; p.inv = 70; p.kb = kb; p.vx = dir * 4; p.vy = -4; puff(p.x + 9, p.y + 17, 10, '#d33');
  if (p.hp <= 0) G.phase = 'lose';
}
function drawSpider(e) {
  const big = e.kind === 'bigspider', k = big ? 2 : 1, f = e.face;
  const bob = (Math.floor(e.t / 20) % 2) ? 2 * k : 0;       // slow up-down bobbing
  const cx = e.x + e.w / 2, by = e.y + e.h, yb = by - 8 * k - bob;
  const body = big ? '#f0c02a' : '#7b3fa8', dark = big ? '#3a2410' : '#241338';
  ctx.strokeStyle = dark; ctx.lineWidth = 2 * k; ctx.lineJoin = 'round';
  for (const sd of [-1, 1]) for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(cx + sd * (3 + i * 3) * k, yb + 2 * k);
    ctx.lineTo(cx + sd * (6 + i * 3) * k, yb - 3 * k + i * k);
    ctx.lineTo(cx + sd * (7 + i * 3) * k, by);
    ctx.stroke();
  }
  ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(cx - f * 2 * k, yb, 8 * k, 5.5 * k, 0, 0, 7); ctx.fill();
  const hx = cx + f * 7 * k;
  if (big) {
    ctx.fillStyle = dark; for (const i of [-6, -2, 2]) ctx.fillRect(cx - f * 2 * k + i * k, yb - 5 * k, 1.5 * k, 10 * k); // stripes
    ctx.fillStyle = body; ctx.fillRect(hx - 4 * k, yb - 5 * k, 8 * k, 9 * k);                                          // face block
    ctx.fillStyle = dark; for (const [dx, dy] of [[-2, -3], [1, -3], [-2, 0], [1, 0], [-.5, 3]]) ctx.fillRect(hx + dx * k, yb + dy * k, 1.5 * k, 1.5 * k);
    ctx.fillRect(hx - 3 * k, yb - 9 * k, 1.5 * k, 4 * k); ctx.fillRect(hx + 1.5 * k, yb - 9 * k, 1.5 * k, 4 * k);       // horns
    ctx.fillStyle = '#fff'; ctx.fillRect(hx - 3 * k, yb + 4 * k, 1.5 * k, 5 * k); ctx.fillRect(hx + 1.5 * k, yb + 4 * k, 1.5 * k, 5 * k); // claws
  } else {

  if (g.phase === 'lose') {
    ctx.fillStyle = 'rgba(40,0,0,.6)'; ctx.fillRect(0, 0, W, H);
    txt('YOU DIED', W / 2, 230, 40, '#e63946', 'center', '#2a0a0a');
    txt(`Wave ${g.wave} · Kills ${g.kills} · Coins +${g.earned}`, W / 2, 275, 14, '#fff');
    button('RETRY', 235, 308, 435, 66, () => startGame(), {size: 40});
    button('MENU', 235, 384, 435, 66, () => { scene = 'mode'; sel = 0; }, {size: 44, bg: '#6b68cf', bgH: '#7d7ae0', col: '#1a1840'});
  }
}

// ---------- input ----------
function pos(e) { const r = c.getBoundingClientRect(); mouse.x = (e.clientX - r.left) * W / r.width; mouse.y = (e.clientY - r.top) * H / r.height; }
c.addEventListener('mousemove', e => {
  pos(e);
  for (const h of hits) if (h.idx !== undefined && over(h.x, h.y, h.w, h.h)) sel = h.idx;
});
c.addEventListener('mousedown', e => { pos(e); for (let i = hits.length - 1; i >= 0; i--) if (over(hits[i].x, hits[i].y, hits[i].w, hits[i].h)) { hits[i].fn(); break; } });
addEventListener('keydown', e => {
  const k = e.key;
  held[k.toLowerCase()] = true;
  const n = scene === 'mode' ? 2 : (scene === 'menu' || scene === 'temples') ? 3 : 0;
  if (scene === 'temples' && k === 'Escape') { scene = 'mode'; sel = 0; return; }
  if (n) {
    if (k === 'ArrowDown') sel = (sel + 1) % n;
    if (k === 'ArrowUp') sel = (sel - 1 + n) % n;
    if (k === 'Enter' || k === ' ') { const h = hits.find(h => h.idx === sel); if (h) h.fn(); }
    if (k === 'Escape' && scene === 'menu') { scene = 'mode'; sel = 0; }
  } else if (scene === 'controls') {
    if (k === 'Enter' || k === ' ' || k === 'Escape') { scene = 'chars'; cur = save.d.chosen; }
  } else if (scene === 'chars') {
    if (k === 'ArrowRight') cur = (cur + 1) % CHARS.length;
    if (k === 'ArrowLeft') cur = (cur - 1 + CHARS.length) % CHARS.length;
    if (k === 'Enter' || k === ' ') { save.d.owned.includes(cur) ? selectChar(cur) : (cur === 0 || save.d.owned.includes(cur - 1)) && buyChar(cur); }
    if (k === 'Escape') { scene = 'mode'; sel = 0; }
  } else if (scene === 'game') gameKey(e);
  if (k.startsWith('Arrow') || k === ' ') e.preventDefault();
});

(function loop() { hits = []; ctx.clearRect(0, 0, W, H); scenes[scene](); requestAnimationFrame(loop); })();
</script>
</body>
